[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fmp-financial-analytics"
version = "0.1.0"
description = "Comprehensive financial analytics platform with FMP API integration, CFA/FRM/CQF metrics, and AI-powered analysis using Agno agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Financial Analytics Team" }
]
keywords = [
    "finance",
    "fmp",
    "cfa",
    "frm",
    "cqf",
    "portfolio",
    "risk-management",
    "quantitative-finance",
    "ai-agent"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "agno>=1.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]
viz = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
]

[project.scripts]
fmp = "fmp_analytics.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fmp_analytics"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "D",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = ["D100", "D104", "D107"]

[tool.ruff.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src/fmp_analytics --cov-report=term-missing"
